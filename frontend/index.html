<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SimpleInvoice</title>
    <meta
      name="description"
      content="SimpleInvoice: create invoices, track what customers owe, record payments and write-offs, and import invoices in bulk from Excel."
    />
    <meta name="application-name" content="SimpleInvoice" />
    <meta name="theme-color" content="#f5f6fa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e1117" media="(prefers-color-scheme: dark)" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Link previews (Slack, LinkedIn, email). Scrapers need absolute URLs: see VITE_SITE_URL -->

    <meta property="og:site_name" content="SimpleInvoice" />
    <meta property="og:title" content="SimpleInvoice: invoicing, payments and write-offs" />
    <meta
      property="og:description"
      content="Create invoices, track what customers owe, record payments in any currency and import invoices in bulk from Excel."
    />
    <meta property="og:url" content="__SITE_URL__/login" />
    <meta property="og:image" content="__SITE_URL__/og-image.png" />

    <meta property="og:image:alt" content="The SimpleInvoice dashboard with invoice totals and a list of invoices" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SimpleInvoice: invoicing, payments and write-offs" />
    <meta
      name="twitter:description"
      content="Create invoices, track what customers owe, record payments in any currency and import invoices in bulk from Excel."
    />
    <meta name="twitter:image" content="__SITE_URL__/og-image.png" />

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
