# Only the login page may be indexed; every other page of this private app
# gets "noindex" (robots.txt says the same, this also covers direct links)
map $request_uri $robots_tag {
    ~^/login/?(\?.*)?$  "";
    default             "noindex, nofollow";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compress text responses: the JS bundle goes from ~1 MB to ~300 KB
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    # /api/invoices -> http://backend:3000/invoices
    location /api/ {
        proxy_pass http://backend:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Hashed build assets can be cached for a long time
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # nginx's mime.types doesn't know .webmanifest
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header X-Robots-Tag "noindex, nofollow";
    }

    # The app shell is always re-checked, so a new deploy shows up straight away
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag $robots_tag;
    }

    # Client-side routing: unknown paths get the SPA
    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Robots-Tag $robots_tag;
    }
}
