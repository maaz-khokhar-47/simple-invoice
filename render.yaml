# Render Blueprint: Postgres, the NestJS API (Docker) and the React app (static site).
# In the Render dashboard: New > Blueprint, pick this repository, and Render creates
# all three. See "Deploying to Render" in the README.
#
# Free plan: the API sleeps after 15 minutes without traffic (the next request takes
# about a minute), and the free database expires 30 days after it is created.
#
# The app calls the API by its public URL, and the API only accepts calls from the
# app's URL (CORS). Render can't pass public URLs between services, so both are
# written below. If Render gives a service a different URL (e.g. the name was taken
# and it added a suffix), update CORS_ORIGIN, VITE_API_URL and VITE_SITE_URL to match.

databases:
  - name: simple-invoice-db
    databaseName: simple_invoice
    user: simple_invoice
    plan: free
    region: singapore
    postgresMajorVersion: "16"
    # Only Render services in this account can connect
    ipAllowList: []

services:
  - type: web
    name: simple-invoice-api-mk
    runtime: docker
    plan: free
    region: singapore
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: simple-invoice-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: "3600"
      - key: CORS_ORIGIN
        value: https://simple-invoice-mk.onrender.com
      # Migrations always run on start; the seed skips rows that already exist
      - key: SEED_ON_START
        value: "true"
      - key: SEED_USER_EMAIL
        value: reviewer@simpleinvoice.dev
      # Asked for when the Blueprint is created
      - key: SEED_USER_PASSWORD
        sync: false
      - key: SEED_USER_NAME
        value: Reviewer

  - type: web
    name: simple-invoice-mk
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: VITE_API_URL
        value: https://simple-invoice-api-mk.onrender.com
      - key: VITE_SITE_URL
        value: https://simple-invoice-mk.onrender.com
    routes:
      # Client-side routing: any path that isn't a file gets the app
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # The CDN doesn't know the .webmanifest extension
      - path: /manifest.webmanifest
        name: Content-Type
        value: application/manifest+json
      # Private pages stay out of search engines (robots.txt says the same)
      - path: /invoices
        name: X-Robots-Tag
        value: noindex, nofollow
      - path: /invoices/*
        name: X-Robots-Tag
        value: noindex, nofollow
